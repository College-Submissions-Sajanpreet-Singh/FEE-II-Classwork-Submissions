<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #f4fbfa;
            color: #111111;
            margin: 0;
            padding: 32px 16px;
        }

        #todo {
            max-width: 560px;
            margin: 48px auto;
            background: #ffffff;
            padding: 32px;
            border: 1px solid #111111;
            border-radius: 18px;
            box-shadow: 8px 8px 0 #ccefeb;
        }

        .heading {
            text-align: center;
            font-size: 26px;
            margin: 0 0 24px;
            letter-spacing: 0;
        }

        .todo-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #todo input {
            min-width: 0;
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #111111;
            border-radius: 10px;
            font: inherit;
            box-sizing: border-box;
            color: #111111;
            background: #ffffff;
        }

        #todo button {
            padding: 12px 15px;
            border: 1px solid #111111;
            border-radius: 10px;
            cursor: pointer;
            background: #ccefeb;
            color: #111111;
            font: inherit;
            font-weight: 700;
        }

        #todo button:hover {
            background: #aee4de;
        }

        #todo input:focus {
            outline: 3px solid #ccefeb;
            outline-offset: 1px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px;
            margin-top: 12px;
            background-color: #ffffff;
            border: 1px solid #111111;
            border-radius: 12px;
        }

        .todo-item p {
            flex: 1;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .todo-item button {
            padding: 8px 11px;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px 12px;
            }

            #todo {
                margin: 24px auto;
                padding: 22px 16px;
                box-shadow: 5px 5px 0 #ccefeb;
            }

            .todo-controls {
                flex-wrap: wrap;
            }

            .todo-controls input {
                flex-basis: 100%;
            }

            .todo-controls button {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div id="todo">
        <h2 class="heading">My To-Do List</h2>
    </div>
    <script src="todo.js"></script>
</body>

</html>
